name: Build and Release

on:
  push:
    branches:
      - master
      - '26.2'
    tags:
      - '*'
  pull_request:
    branches:
      - master
      - '26.2'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update. Leave empty to only build artifacts.
        required: false
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease when creating it.
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build all loaders
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and collect both font editions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          mkdir -p release
          for variant in standard misans; do
            ./gradlew --no-daemon clean build -Pfont_variant="$variant"
            suffix=universal
            if [[ "$variant" == misans ]]; then suffix=universal-misans; fi
            for loader in fabric forge neoforge; do
              jars=("$loader"/build/libs/*-"$suffix".jar)
              [[ ${#jars[@]} -eq 1 && -f "${jars[0]}" ]]
              cp -- "${jars[0]}" release/
            done
          done
          python3 scripts/check-release-variants.py release fabric forge neoforge
          ls -lh release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: modernui-mc-release-jars
          path: release/*.jar
          if-no-files-found: error

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG}"
          fi

          if [[ -n "${tag}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "tag=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create or update GitHub release
        if: steps.release.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release/*.jar --clobber
          else
            prerelease_arg=()
            if [[ "${PRERELEASE}" == "true" ]]; then
              prerelease_arg=(--prerelease)
            fi
            gh release create "${RELEASE_TAG}" release/*.jar \
              --title "${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --generate-notes \
              "${prerelease_arg[@]}"
          fi
