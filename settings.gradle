pluginManagement {
    repositories {
        maven {
            url 'https://maven.minecraftforge.net/'
        }
        maven {
            url 'https://maven.neoforged.net/releases/'
        }
        maven {
            url 'https://maven.fabricmc.net/'
        }
        maven {
            url 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            url 'https://repo.codemc.io/repository/relativitymc/'
        }
        gradlePluginPortal()
    }
}

rootProject.name = 'ModernUI-MC'

include 'common'

def platformNames = [forge: 'Forge', neoforge: 'NeoForge', fabric: 'Fabric']
providers.gradleProperty('enabled_platforms').getOrElse('forge,neoforge,fabric')
        .split(',').collect { it.trim() }.each { platform ->
    if (!platformNames.containsKey(platform)) {
        throw new GradleException("Unknown platform: ${platform}")
    }
    if (platform == 'neoforge' && !providers.gradleProperty('neoforge_version').get()
            .startsWith(providers.gradleProperty('minecraft_version').get() + '.')) {
        throw new GradleException('Set neoforge_version to a published build for the target Minecraft version before enabling NeoForge.')
    }
    include platform
    project(":${platform}").name = "ModernUI-${platformNames[platform]}"
}
